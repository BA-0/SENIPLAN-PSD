# SENICO Diagnostic Stratégique — reverse proxy Nginx
# A copier vers /etc/nginx/sites-available/senico-diagnostic.conf puis :
#   sudo ln -s /etc/nginx/sites-available/senico-diagnostic.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Adapter le nom de domaine avant mise en production.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name diagnostic.senico.sn;

    # Redirection HTTPS (activer une fois le certificat TLS installe, cf. DEPLOYMENT.md)
    # return 301 https://$host$request_uri;

    client_max_body_size 15M;

    access_log /var/log/nginx/senico-diagnostic.access.log;
    error_log  /var/log/nginx/senico-diagnostic.error.log;

    # API backend (Spring Boot)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket STOMP/SockJS (suivi temps reel)
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Frontend (Next.js via PM2, port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

