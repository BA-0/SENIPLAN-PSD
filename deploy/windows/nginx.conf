# SENIPLAN - reverse proxy Nginx pour Windows Server.
#
# A copier vers C:\nginx\conf\nginx.conf (remplace le fichier livre avec Nginx), puis, depuis C:\nginx :
#   .\nginx.exe -t              verifie la configuration
#   nssm restart SeniplanProxy  ou  .\nginx.exe -s reload  si Nginx tourne deja
#
# Adapter server_name avant la mise en production. Les chemins relatifs (logs/, mime.types)
# se lisent depuis C:\nginx.

# Sous Windows, Nginx n'exploite qu'un seul worker : largement suffisant ici.
worker_processes 1;

error_log logs/error.log;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    access_log logs/seniplan.access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name seniplan.senico.sn;

        # Redirection HTTPS : a activer une fois le certificat installe (bloc 443 ci-dessous)
        # return 301 https://$host$request_uri;

        client_max_body_size 15M;

        # Validation Let's Encrypt (win-acme, validation "filesystem" sur C:\nginx\html) : doit rester en HTTP
        location /.well-known/acme-challenge/ {
            root html;
        }

        # API backend (Spring Boot, 127.0.0.1:8080)
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket STOMP/SockJS (suivi temps reel)
        location /ws/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /actuator/health {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        # Frontend (Next.js, 127.0.0.1:3000)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- Bloc HTTPS, a activer une fois le certificat depose dans C:\nginx\certs (cf. DEPLOYMENT-WINDOWS.md) ---
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name seniplan.senico.sn;
    #
    #     ssl_certificate     certs/seniplan.senico.sn-chain.pem;
    #     ssl_certificate_key certs/seniplan.senico.sn-key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #
    #     client_max_body_size 15M;
    #
    #     ... (memes location que ci-dessus) ...
    # }
}
